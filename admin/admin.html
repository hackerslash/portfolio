<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content admin</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #16161b; --panel-2: #1d1d24; --line: #2a2a33;
    --ink: #ececef; --ink-2: #a1a1ab; --ink-3: #6e6e78;
    --accent: #7c9cff; --accent-ink: #0d0d10; --danger: #ff6b6b; --ok: #4ade80;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 14px 24px; background: rgba(13,13,16,.85);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  header .spacer { flex: 1; }
  .badge { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); padding: 3px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .06em; }
  .status { font-size: 13px; color: var(--ink-2); min-width: 90px; text-align: right; }
  .status.dirty { color: var(--accent); }
  .status.saved { color: var(--ok); }
  .status.err { color: var(--danger); }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink); padding: 8px 14px;
    transition: border-color .15s, background .15s, opacity .15s;
  }
  button:hover { border-color: #3a3a46; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.icon { padding: 6px 9px; line-height: 1; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .toolbar .hint { color: var(--ink-3); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }

  .card {
    display: grid; grid-template-columns: 132px 1fr auto; gap: 16px;
    padding: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); align-items: start;
  }
  .card.dragging { opacity: .4; }
  .card.over { border-color: var(--accent); }
  .thumb { position: relative; }
  .thumb img { width: 132px; height: 132px; object-fit: cover; border-radius: 8px; background: var(--panel-2); display: block; }
  .thumb .idx { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color:#fff; font-size: 11px; padding: 2px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .fields { display: grid; gap: 8px; min-width: 0; }
  .row { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: start; }
  .row label { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 8px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 42px; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .drag-handle { cursor: grab; color: var(--ink-3); text-align: center; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; user-select: none; }
  .drag-handle:active { cursor: grabbing; }
  .empty { text-align: center; color: var(--ink-3); padding: 60px 20px; border: 1px dashed var(--line); border-radius: var(--radius); }
  #file { display: none; }
  footer { color: var(--ink-3); font-size: 12px; text-align: center; padding: 30px 0 40px; }
</style>
</head>
<body>
<header>
  <h1>Content admin</h1>
  <span class="badge">gallery</span>
  <div class="spacer"></div>
  <span id="status" class="status"></span>
  <button id="save" class="primary" disabled>Save to cv.json</button>
</header>

<main>
  <div class="toolbar">
    <button id="add">+ Add images</button>
    <input type="file" id="file" accept="image/*" multiple />
    <span class="hint">Drag a card by its handle to reorder. Changes save to <code>cv.json</code> only when you hit Save.</span>
  </div>
  <div id="grid" class="grid"></div>
  <footer>Dev-only · reachable at <code>/admin</code> under <code>npm run dev</code> · no auth</footer>
</main>

<script>
const $ = (s) => document.querySelector(s)
const grid = $('#grid'), statusEl = $('#status'), saveBtn = $('#save')
let cv = null, dirty = false

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || '') }
function markDirty() { dirty = true; saveBtn.disabled = false; setStatus('Unsaved changes', 'dirty') }

async function load() {
  setStatus('Loading…')
  cv = await (await fetch('/api/cv')).json()
  cv.gallery = cv.gallery || []
  render()
  setStatus('')
}

function render() {
  grid.innerHTML = ''
  if (!cv.gallery.length) {
    grid.innerHTML = '<div class="empty">No images yet — click <b>+ Add images</b> to upload some.</div>'
    return
  }
  cv.gallery.forEach((f, i) => grid.appendChild(card(f, i)))
}

function field(f, key, multiline, placeholder) {
  const el = document.createElement(multiline ? 'textarea' : 'input')
  el.value = f[key] || ''
  el.placeholder = placeholder
  el.oninput = () => { f[key] = el.value; markDirty() }
  return el
}

function labeled(text, control) {
  const row = document.createElement('div'); row.className = 'row'
  const lab = document.createElement('label'); lab.textContent = text
  row.append(lab, control); return row
}

function card(f, i) {
  const el = document.createElement('div')
  el.className = 'card'; el.dataset.index = i

  const thumb = document.createElement('div'); thumb.className = 'thumb'
  thumb.innerHTML = `<img src="${f.src}" alt="" loading="lazy" /><span class="idx">${i + 1}</span>`

  const fields = document.createElement('div'); fields.className = 'fields'
  fields.append(
    labeled('Caption', field(f, 'caption', false, 'Kodagu — dawn mist')),
    labeled('Description', field(f, 'description', true, 'The story behind the frame…')),
    labeled('Alt', field(f, 'alt', false, 'Describe the image for screen readers')),
    labeled('Tag', field(f, 'tag', false, 'nature, street, travel…')),
  )

  const actions = document.createElement('div'); actions.className = 'actions'
  const handle = document.createElement('div'); handle.className = 'drag-handle'; handle.textContent = '⠿'; handle.title = 'Drag to reorder'
  const up = mkBtn('↑', 'Move up', () => move(i, i - 1)); up.disabled = i === 0
  const down = mkBtn('↓', 'Move down', () => move(i, i + 1)); down.disabled = i === cv.gallery.length - 1
  const del = mkBtn('✕', 'Remove', () => { if (confirm('Remove this image from the gallery? (the file stays on disk)')) { cv.gallery.splice(i, 1); markDirty(); render() } })
  del.classList.add('danger')
  actions.append(handle, up, down, del)

  el.append(thumb, fields, actions)
  wireDrag(el, handle, i)
  return el
}

function mkBtn(txt, title, onClick) {
  const b = document.createElement('button'); b.className = 'icon'; b.textContent = txt; b.title = title; b.onclick = onClick; return b
}

function move(from, to) {
  if (to < 0 || to >= cv.gallery.length) return
  const [item] = cv.gallery.splice(from, 1)
  cv.gallery.splice(to, 0, item)
  markDirty(); render()
}

// Native drag reorder (handle-initiated)
let dragFrom = null
function wireDrag(card, handle, i) {
  handle.draggable = true
  handle.addEventListener('dragstart', (e) => { dragFrom = i; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move' })
  handle.addEventListener('dragend', () => { card.classList.remove('dragging'); document.querySelectorAll('.card.over').forEach(c => c.classList.remove('over')) })
  card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('over') })
  card.addEventListener('dragleave', () => card.classList.remove('over'))
  card.addEventListener('drop', (e) => { e.preventDefault(); card.classList.remove('over'); if (dragFrom !== null && dragFrom !== i) move(dragFrom, i); dragFrom = null })
}

// Upload
$('#add').onclick = () => $('#file').click()
$('#file').onchange = async (e) => {
  const files = [...e.target.files]
  e.target.value = ''
  if (!files.length) return
  setStatus(`Optimizing ${files.length} image${files.length > 1 ? 's' : ''}…`)
  try {
    for (const file of files) {
      const res = await fetch('/api/cv/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'upload failed')
      cv.gallery.push(data)
    }
    markDirty(); render()
  } catch (err) { setStatus(String(err.message || err), 'err') }
}

// Save
saveBtn.onclick = async () => {
  setStatus('Saving…'); saveBtn.disabled = true
  try {
    const res = await fetch('/api/cv', { method: 'POST', body: JSON.stringify(cv) })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'save failed')
    dirty = false; setStatus('Saved ✓', 'saved')
  } catch (err) { setStatus(String(err.message || err), 'err'); saveBtn.disabled = false }
}

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = '' } })
load()
</script>
</body>
</html>

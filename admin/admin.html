<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Content admin</title>
<link rel="stylesheet" href="/admin/tokens.css" />
<style>
  /* Admin chrome, built entirely on the site's own design tokens. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--color-paper); color: var(--color-ink-2);
    font-family: var(--font-body); font-size: var(--text-base); line-height: var(--leading-body);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--color-accent-mid); }

  header {
    position: sticky; top: 0; z-index: var(--z-sticky);
    display: flex; align-items: center; gap: var(--space-sm);
    padding: var(--space-xs) var(--space-md);
    background: color-mix(in oklch, var(--color-paper) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: var(--rule-hair) solid var(--color-rule-2);
  }
  header h1 {
    font-family: var(--font-display); font-size: var(--text-md); margin: 0; font-weight: 700;
    letter-spacing: var(--track-body); color: var(--color-ink);
  }
  header .tag {
    font-size: var(--text-xs); letter-spacing: var(--track-label); text-transform: uppercase;
    color: var(--color-accent-text); border: var(--rule-hair) solid var(--color-accent-mid);
    padding: 2px 8px; border-radius: var(--radius-pill);
  }
  header .spacer { flex: 1; }
  .status { font-size: var(--text-sm); color: var(--color-ink-3); min-width: 108px; text-align: right; }
  .status.dirty { color: var(--color-accent-text); } .status.saved { color: var(--color-accent-text); } .status.err { color: oklch(63% 0.2 25); }

  button {
    font: inherit; cursor: pointer; border-radius: var(--radius-sm); border: var(--rule-hair) solid var(--color-rule-2);
    background: var(--color-paper-2); color: var(--color-ink-2); padding: 8px 14px;
    transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  }
  button:hover { border-color: var(--color-accent-mid); color: var(--color-ink); }
  button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--color-accent); color: var(--color-accent-ink); border-color: var(--color-accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); color: var(--color-accent-ink); }
  button.icon { padding: 5px 9px; line-height: 1; font-size: var(--text-sm); }
  button.danger:hover { border-color: oklch(63% 0.2 25); color: oklch(70% 0.2 25); }

  .layout { display: grid; grid-template-columns: 210px 1fr; align-items: start; }
  nav {
    position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px);
    overflow-y: auto; padding: var(--space-sm) var(--space-xs); border-right: var(--rule-hair) solid var(--color-rule);
    display: flex; flex-direction: column; gap: 2px;
  }
  nav button {
    text-align: left; border: 0; background: transparent; color: var(--color-ink-3);
    padding: 8px 12px; border-radius: var(--radius-sm); text-transform: capitalize; letter-spacing: var(--track-body);
  }
  nav button:hover { background: var(--color-paper-2); color: var(--color-ink); }
  nav button.active { background: var(--color-accent-dim); color: var(--color-ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--color-accent); }
  nav button .count { color: var(--color-ink-4); font-size: var(--text-xs); float: right; font-variant-numeric: tabular-nums; }

  main { max-width: 860px; padding: var(--space-md); }
  .toolbar { display: flex; align-items: center; gap: var(--space-xs); margin-bottom: var(--space-md); }
  .toolbar .hint { color: var(--color-ink-4); font-size: var(--text-sm); }
  h2.section { font-family: var(--font-display); margin: 0 0 var(--space-3xs); font-size: var(--text-2xl); font-weight: 700; letter-spacing: var(--track-display); text-transform: capitalize; color: var(--color-ink); }
  .sub { color: var(--color-ink-4); font-size: var(--text-xs); letter-spacing: var(--track-label); text-transform: uppercase; margin: 0 0 var(--space-md); }

  /* generic editor */
  .obj { display: grid; gap: var(--space-2xs); }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: var(--space-xs); align-items: start; }
  .row > .lbl { color: var(--color-ink-3); font-size: var(--text-xs); text-transform: capitalize; letter-spacing: var(--track-body); padding-top: 8px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; font: inherit; color: var(--color-ink); background: var(--color-paper-2);
    border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-sm); padding: 7px 10px; resize: vertical;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 2px var(--color-accent-dim); }
  textarea { min-height: 44px; line-height: var(--leading-snug); }
  label.chk { display: inline-flex; align-items: center; gap: 8px; padding-top: 6px; color: var(--color-ink-2); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--color-accent); }
  .nested { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-sm); background: var(--color-paper-2); }

  .items { display: grid; gap: var(--space-2xs); }
  .item {
    display: grid; grid-template-columns: 1fr auto; gap: var(--space-xs); align-items: start;
    border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: 12px 12px 12px 14px;
    background: var(--color-paper-2); border-left: 3px solid var(--color-accent-mid);
  }
  .item-actions { display: flex; flex-direction: column; gap: 6px; }
  .add { margin-top: var(--space-3xs); }

  /* gallery cards */
  .gcard { display: grid; grid-template-columns: 120px 1fr auto; gap: var(--space-xs); padding: 12px;
    background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); align-items: start; }
  .gcard.dragging { opacity: .4; } .gcard.over { border-color: var(--color-accent); }
  .thumb { position: relative; }
  .thumb img { width: 120px; height: 120px; object-fit: cover; border-radius: var(--radius-sm); background: var(--color-paper-3); display: block; }
  .thumb .idx { position: absolute; top: 6px; left: 6px; background: rgb(0 0 0 / .6); color:#fff; font-size: var(--text-xs); padding: 2px 6px; border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; }
  .drag-handle { cursor: grab; color: var(--color-ink-3); text-align: center; padding: 5px 9px; border: var(--rule-hair) solid var(--color-rule-2); border-radius: var(--radius-sm); user-select: none; }
  .empty { text-align: center; color: var(--color-ink-4); padding: var(--space-xl) var(--space-md); border: var(--rule-hair) dashed var(--color-rule-2); border-radius: var(--radius-card); }
  #file { display: none; }
  footer { color: var(--color-ink-4); font-size: var(--text-xs); padding: var(--space-lg) var(--space-md) var(--space-xl); }
  code { background: var(--color-paper-3); padding: 1px 5px; border-radius: 4px; font-size: .92em; color: var(--color-ink-2); }
</style>
</head>
<body>
<header>
  <h1>Content admin</h1>
  <span class="tag">cv.json</span>
  <div class="spacer"></div>
  <span id="status" class="status"></span>
  <button id="save" class="primary" disabled>Save to cv.json</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <div>
    <main id="main"></main>
    <footer>Dev-only · <code>/admin</code> under <code>npm run dev</code> · edits persist to <code>cv.json</code> only on Save.</footer>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple />

<script>
const $ = (s) => document.querySelector(s)
const statusEl = $('#status'), saveBtn = $('#save'), main = $('#main'), navEl = $('#nav')
let cv = null, dirty = false, active = null

// ── tiny DOM helper ──
function h(tag, props, ...kids) {
  const el = document.createElement(tag)
  for (const k in (props || {})) {
    if (k === 'class') el.className = props[k]
    else if (k.startsWith('on')) el[k.toLowerCase()] = props[k]
    else if (k in el) el[k] = props[k]
    else el.setAttribute(k, props[k])
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid))
  return el
}
const pretty = (k) => k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[_-]/g, ' ').replace(/^\w/, (c) => c.toUpperCase())
const isObj = (v) => v && typeof v === 'object' && !Array.isArray(v)

function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status ' + (cls || '') }
function markDirty() { dirty = true; saveBtn.disabled = false; setStatus('Unsaved changes', 'dirty') }

async function load() {
  setStatus('Loading…')
  cv = await (await fetch('/api/cv')).json()
  active = Object.keys(cv)[0]
  renderNav(); renderSection()
  setStatus('')
}

function renderNav() {
  navEl.innerHTML = ''
  for (const k of Object.keys(cv)) {
    const v = cv[k]
    const count = Array.isArray(v) ? v.length : ''
    navEl.append(h('button', {
      class: k === active ? 'active' : '',
      onClick: () => { active = k; renderNav(); renderSection() },
    }, pretty(k), count !== '' ? h('span', { class: 'count' }, String(count)) : null))
  }
}

function renderSection() {
  main.innerHTML = ''
  main.append(h('h2', { class: 'section' }, pretty(active)))
  const v = cv[active]
  if (active === 'gallery') { renderGallery(); return }
  main.append(h('p', { class: 'sub' }, Array.isArray(v) ? `${v.length} entr${v.length === 1 ? 'y' : 'ies'}` : 'Fields'))
  main.append(Array.isArray(v) ? arrayEditor(cv, active) : objEditor(v))
}
const rerender = () => renderSection()

// ── generic value editor: mutates parent[key] in place ──
function valueEditor(parent, key) {
  const v = parent[key]
  if (typeof v === 'boolean') {
    const cb = h('input', { type: 'checkbox', checked: v, onChange: (e) => { parent[key] = e.target.checked; markDirty() } })
    return h('label', { class: 'chk' }, cb, v ? 'true' : 'false')
  }
  if (typeof v === 'number') {
    return h('input', { type: 'number', value: v, onInput: (e) => { parent[key] = e.target.value === '' ? 0 : Number(e.target.value); markDirty() } })
  }
  if (Array.isArray(v)) return arrayEditor(parent, key)
  if (isObj(v)) return h('div', { class: 'nested' }, objEditor(v))
  // string or null
  const wasNull = v === null
  const long = wasNull ? false : (v.length > 60 || v.includes('\n') || /summary|intro|description|tagline|headline|bio|about/i.test(key))
  return h(long ? 'textarea' : 'input', {
    type: 'text', value: v ?? '',
    onInput: (e) => { const s = e.target.value; parent[key] = (wasNull && s === '') ? null : s; markDirty() },
  })
}

function objEditor(obj) {
  const box = h('div', { class: 'obj' })
  for (const k of Object.keys(obj)) box.append(h('div', { class: 'row' }, h('div', { class: 'lbl' }, pretty(k)), valueEditor(obj, k)))
  return box
}

function blankLike(sample) {
  if (Array.isArray(sample)) return []
  if (isObj(sample)) { const o = {}; for (const k in sample) o[k] = blankLike(sample[k]); return o }
  if (typeof sample === 'boolean') return false
  if (typeof sample === 'number') return 0
  return sample === null ? null : ''
}

function arrayEditor(parent, key) {
  const arr = parent[key]
  const primitive = arr.length === 0 || typeof arr[0] !== 'object' || arr[0] === null
  const box = h('div', { class: 'items' })

  arr.forEach((item, i) => {
    const controls = h('div', { class: 'item-actions' },
      mkBtn('↑', 'Move up', () => move(arr, i, i - 1), i === 0),
      mkBtn('↓', 'Move down', () => move(arr, i, i + 1), i === arr.length - 1),
      mkBtn('✕', 'Remove', () => { arr.splice(i, 1); markDirty(); rerender() }, false, 'danger'),
    )
    const editor = primitive ? valueEditor(arr, i) : h('div', { class: 'obj' }, objEditor(item))
    box.append(h('div', { class: 'item' }, editor, controls))
  })

  const add = h('button', { class: 'add', onClick: () => {
    arr.push(arr.length ? blankLike(arr[0]) : ''); markDirty(); rerender()
  } }, '+ Add ' + (primitive ? 'item' : 'entry'))

  return h('div', {}, box, add)
}

function mkBtn(txt, title, onClick, disabled, extra) {
  return h('button', { class: 'icon ' + (extra || ''), title, disabled: !!disabled, onClick }, txt)
}
function move(arr, from, to) {
  if (to < 0 || to >= arr.length) return
  const [x] = arr.splice(from, 1); arr.splice(to, 0, x); markDirty(); rerender()
}

// ── gallery: dedicated image UI ──
function renderGallery() {
  main.append(
    h('div', { class: 'toolbar' },
      h('button', { onClick: () => $('#file').click() }, '+ Add images'),
      h('span', { class: 'hint' }, 'Drag the ⠿ handle to reorder.'),
    ),
  )
  const g = cv.gallery
  if (!g.length) { main.append(h('div', { class: 'empty' }, 'No images yet — click + Add images.')); return }
  const grid = h('div', { class: 'items' })
  g.forEach((f, i) => grid.append(gcard(f, i)))
  main.append(grid)
}

function gField(f, key, multiline, ph) {
  return h(multiline ? 'textarea' : 'input', {
    type: 'text', value: f[key] || '', placeholder: ph,
    onInput: (e) => { f[key] = e.target.value; markDirty() },
  })
}
function gcard(f, i) {
  const g = cv.gallery
  const thumb = h('div', { class: 'thumb' }, h('img', { src: f.src, loading: 'lazy' }), h('span', { class: 'idx' }, String(i + 1)))
  const fields = h('div', { class: 'obj' },
    h('div', { class: 'row' }, h('div', { class: 'lbl' }, 'Caption'), gField(f, 'caption', false, 'Kodagu — dawn mist')),
    h('div', { class: 'row' }, h('div', { class: 'lbl' }, 'Description'), gField(f, 'description', true, 'The story behind the frame…')),
    h('div', { class: 'row' }, h('div', { class: 'lbl' }, 'Alt'), gField(f, 'alt', false, 'Describe for screen readers')),
    h('div', { class: 'row' }, h('div', { class: 'lbl' }, 'Tag'), gField(f, 'tag', false, 'nature, street…')),
  )
  const handle = h('div', { class: 'drag-handle', title: 'Drag to reorder' }, '⠿')
  const actions = h('div', { class: 'item-actions' }, handle,
    mkBtn('↑', 'Move up', () => move(g, i, i - 1), i === 0),
    mkBtn('↓', 'Move down', () => move(g, i, i + 1), i === g.length - 1),
    mkBtn('✕', 'Remove', () => { if (confirm('Remove from gallery? (file stays on disk)')) { g.splice(i, 1); markDirty(); rerender() } }, false, 'danger'),
  )
  const card = h('div', { class: 'gcard' }, thumb, fields, actions)
  wireDrag(card, handle, i, g)
  return card
}

let dragFrom = null
function wireDrag(card, handle, i, arr) {
  handle.draggable = true
  handle.addEventListener('dragstart', (e) => { dragFrom = i; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move' })
  handle.addEventListener('dragend', () => { card.classList.remove('dragging'); document.querySelectorAll('.gcard.over').forEach(c => c.classList.remove('over')) })
  card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('over') })
  card.addEventListener('dragleave', () => card.classList.remove('over'))
  card.addEventListener('drop', (e) => { e.preventDefault(); card.classList.remove('over'); if (dragFrom !== null && dragFrom !== i) move(arr, dragFrom, i); dragFrom = null })
}

$('#file').onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = ''
  if (!files.length) return
  setStatus(`Optimizing ${files.length} image(s)…`)
  try {
    for (const file of files) {
      const res = await fetch('/api/cv/upload?name=' + encodeURIComponent(file.name), { method: 'POST', body: file })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || 'upload failed')
      cv.gallery.push(data)
    }
    markDirty(); renderNav(); rerender()
  } catch (err) { setStatus(String(err.message || err), 'err') }
}

saveBtn.onclick = async () => {
  setStatus('Saving…'); saveBtn.disabled = true
  try {
    const res = await fetch('/api/cv', { method: 'POST', body: JSON.stringify(cv) })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || 'save failed')
    dirty = false; setStatus('Saved ✓', 'saved')
  } catch (err) { setStatus(String(err.message || err), 'err'); saveBtn.disabled = false }
}

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = '' } })
load()
</script>
</body>
</html>
